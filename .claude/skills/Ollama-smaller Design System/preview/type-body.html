<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:22px 26px;background:#fff;}
  .row + .row{margin-top:14px;border-top:1px solid var(--color-hairline);padding-top:14px;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--color-mute);white-space:nowrap;}
  .body-spec{font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--color-body);max-width:430px;}
  .label-spec{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--color-charcoal);}
  .sub-spec{font-family:var(--font-body);font-size:13px;color:var(--color-mute);}
</style>
</head>
<body>
  <div class="row"><div class="body-spec">Body prose. A documentation-first system tuned denser than a marketing site — density over air.</div><div class="meta">ui-sans · 14 / 1.45</div></div>
  <div class="row"><div class="label-spec">Control label / nav</div><div class="meta">13 / 500</div></div>
  <div class="row"><div class="sub-spec">Sub-text, captions, placeholders</div><div class="meta">13 / mute</div></div>
</body>
</html>

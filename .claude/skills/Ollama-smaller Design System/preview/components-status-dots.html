<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:24px 26px;background:#fff;}
  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .item{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-body);font-size:12px;color:var(--color-charcoal);}
  .hx{font-family:var(--font-mono);font-size:9px;color:var(--color-mute);margin-left:2px;}
</style>
</head>
<body>
  <div class="row">
    <span class="item"><span class="dot dot-clean"></span>clean<span class="hx">#27c93f</span></span>
    <span class="item"><span class="dot dot-low"></span>low<span class="hx">#94a3b8</span></span>
    <span class="item"><span class="dot dot-medium"></span>medium<span class="hx">#eab308</span></span>
    <span class="item"><span class="dot dot-high"></span>high<span class="hx">#f97316</span></span>
    <span class="item"><span class="dot dot-critical"></span>critical<span class="hx">#ef4444</span></span>
    <span class="item"><span class="dot dot-vuln"></span>vuln<span class="hx">#ff5f56</span></span>
    <span class="item"><span class="dot dot-stale"></span>stale<span class="hx">#a3a3a3</span></span>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:24px 26px;background:#fff;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .item{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-body);font-size:12px;color:var(--color-charcoal);}
  .strip{display:flex;gap:4px;flex-wrap:wrap;}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--color-mute);margin-top:12px;}
</style>
</head>
<body>
  <div class="legend">
    <span class="item"><span class="tl tl-empty"></span>empty</span>
    <span class="item"><span class="tl tl-clean"></span>clean</span>
    <span class="item"><span class="tl tl-low"></span>low</span>
    <span class="item"><span class="tl tl-medium"></span>medium</span>
    <span class="item"><span class="tl tl-high"></span>high / vuln</span>
    <span class="item"><span class="tl tl-critical"></span>critical</span>
  </div>
  <div class="strip">
    <span class="tl tl-empty"></span><span class="tl tl-clean"></span><span class="tl tl-clean"></span>
    <span class="tl tl-low"></span><span class="tl tl-medium"></span><span class="tl tl-clean"></span>
    <span class="tl tl-high"></span><span class="tl tl-critical"></span><span class="tl tl-medium"></span>
    <span class="tl tl-clean"></span><span class="tl tl-clean"></span><span class="tl tl-empty"></span>
    <span class="tl tl-clean"></span><span class="tl tl-low"></span><span class="tl tl-clean"></span>
    <span class="tl tl-medium"></span><span class="tl tl-high"></span><span class="tl tl-clean"></span>
  </div>
  <div class="cap">activity over time — one 13px cell per period</div>
</body>
</html>

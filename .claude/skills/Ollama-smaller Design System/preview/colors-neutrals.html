<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:22px 24px;background:#fff;}
  .ramp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:48px;border-radius:8px;border:1px solid var(--color-hairline);}
  .name{font-family:var(--font-mono);font-size:10px;color:var(--color-charcoal);line-height:1.3;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--color-mute);}
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="name">canvas</div><div class="hex">#ffffff</div></div>
    <div class="sw"><div class="chip" style="background:#000000"></div><div class="name">ink</div><div class="hex">#000000</div></div>
    <div class="sw"><div class="chip" style="background:#525252"></div><div class="name">charcoal</div><div class="hex">#525252</div></div>
    <div class="sw"><div class="chip" style="background:#737373"></div><div class="name">body</div><div class="hex">#737373</div></div>
    <div class="sw"><div class="chip" style="background:#a3a3a3"></div><div class="name">mute</div><div class="hex">#a3a3a3</div></div>
    <div class="sw"><div class="chip" style="background:#d4d4d4"></div><div class="name">hairline+</div><div class="hex">#d4d4d4</div></div>
  </div>
</body>
</html>

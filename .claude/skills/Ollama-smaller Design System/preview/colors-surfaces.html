<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:22px 24px;background:#fff;}
  .row{display:flex;gap:14px;}
  .surf{flex:1;height:74px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;}
  .lab{font-family:var(--font-mono);font-size:10px;}
  .cap{font-family:var(--font-body);font-size:11px;color:var(--color-charcoal);margin-top:12px;}
</style>
</head>
<body>
  <div class="row">
    <div class="surf" style="background:#ffffff;border:1px solid var(--color-hairline)"><span class="lab" style="color:#737373">canvas&nbsp;#ffffff</span></div>
    <div class="surf" style="background:#fafafa;border:1px solid var(--color-hairline)"><span class="lab" style="color:#737373">surface-soft&nbsp;#fafafa</span></div>
    <div class="surf" style="background:#171717"><span class="lab" style="color:#fff">surface-dark&nbsp;#171717</span></div>
  </div>
  <div class="cap">Flat surfaces only. The dark surface is the one "look here" elevation — used at most once per view.</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:22px 26px;background:#fff;}
  .scale{display:flex;flex-direction:column;gap:9px;}
  .unit{display:flex;align-items:center;gap:14px;}
  .bar{height:14px;background:var(--color-ink);border-radius:3px;}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--color-charcoal);width:118px;}
</style>
</head>
<body>
  <div class="scale">
    <div class="unit"><span class="tok">xs · 4</span><div class="bar" style="width:4px"></div></div>
    <div class="unit"><span class="tok">sm · 8</span><div class="bar" style="width:8px"></div></div>
    <div class="unit"><span class="tok">md · 12</span><div class="bar" style="width:12px"></div></div>
    <div class="unit"><span class="tok">lg · 16</span><div class="bar" style="width:16px"></div></div>
    <div class="unit"><span class="tok">xl · 24</span><div class="bar" style="width:24px"></div></div>
    <div class="unit"><span class="tok">xxl · 32</span><div class="bar" style="width:32px"></div></div>
    <div class="unit"><span class="tok">section · 48</span><div class="bar" style="width:48px"></div></div>
  </div>
</body>
</html>

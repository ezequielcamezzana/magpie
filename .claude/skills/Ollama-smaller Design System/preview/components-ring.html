<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<link rel="stylesheet" href="../source/ring.css">
<style>
  body{padding:18px 26px;background:#fff;display:flex;align-items:center;gap:30px;}
  .legend{display:flex;flex-direction:column;gap:7px;}
  .ring-legend-item{font-family:var(--font-body);font-size:12px;color:var(--color-charcoal);}
  .count{font-family:var(--font-mono);font-size:11px;color:var(--color-mute);margin-left:4px;}
</style>
</head>
<body>
  <div class="ring-wrap" id="ring"></div>
  <div class="legend">
    <div class="ring-legend-item"><span class="ring-swatch" style="background:#ef4444"></span>Critical<span class="count">3</span></div>
    <div class="ring-legend-item"><span class="ring-swatch" style="background:#f97316"></span>High<span class="count">5</span></div>
    <div class="ring-legend-item"><span class="ring-swatch" style="background:#eab308"></span>Medium<span class="count">8</span></div>
    <div class="ring-legend-item"><span class="ring-swatch" style="background:#94a3b8"></span>Low<span class="count">12</span></div>
  </div>
  <script src="../source/ring.js"></script>
  <script>
    document.getElementById('ring').innerHTML = renderRing([
      {value:3,sev:'critical'},{value:5,sev:'high'},
      {value:8,sev:'medium'},{value:12,sev:'low'}
    ],{size:120,strokeWidth:18});
  </script>
</body>
</html>

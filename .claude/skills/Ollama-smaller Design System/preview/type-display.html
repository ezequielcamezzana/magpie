<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:22px 26px;background:#fff;}
  .row{display:flex;align-items:baseline;gap:14px;}
  .row + .row{margin-top:14px;border-top:1px solid var(--color-hairline);padding-top:14px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--color-mute);white-space:nowrap;}
  .spec-hero{font-family:var(--font-display);font-size:24px;font-weight:500;line-height:1.2;color:var(--color-ink);}
  .spec-title{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.3;color:var(--color-ink);}
  .spec-brand{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--color-ink);}
</style>
</head>
<body>
  <div class="row"><div class="spec-hero">Display, hero scale</div><div class="meta">SF&nbsp;Pro&nbsp;Rounded · 24 / 500</div></div>
  <div class="row"><div class="spec-title">Card title, section head</div><div class="meta">18 / 600</div></div>
  <div class="row"><div class="spec-brand">Wordmark</div><div class="meta">16 / 600</div></div>
</body>
</html>

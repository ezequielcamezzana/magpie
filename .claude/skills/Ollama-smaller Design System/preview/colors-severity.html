<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:22px 24px;background:#fff;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .item{display:flex;flex-direction:column;gap:7px;align-items:flex-start;}
  .hx{font-family:var(--font-mono);font-size:10px;color:var(--color-mute);}
  .cap{font-family:var(--font-body);font-size:11px;color:var(--color-charcoal);margin-bottom:10px;}
</style>
</head>
<body>
  <div class="cap">The one exception to monochrome — CVSS-bucketed, soft tint + matching ink. <code class="ds" style="font-size:11px">.sev-*</code> badges only.</div>
  <div class="chips">
    <div class="item"><span class="sev sev-critical">CRITICAL</span><span class="hx">9.0–10</span></div>
    <div class="item"><span class="sev sev-high">HIGH</span><span class="hx">7.0–8.9</span></div>
    <div class="item"><span class="sev sev-medium">MEDIUM</span><span class="hx">4.0–6.9</span></div>
    <div class="item"><span class="sev sev-low">LOW</span><span class="hx">0.1–3.9</span></div>
    <div class="item"><span class="sev sev-none">NONE</span><span class="hx">no score</span></div>
  </div>
</body>
</html>

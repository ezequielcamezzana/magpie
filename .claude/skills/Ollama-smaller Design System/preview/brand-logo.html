<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../source/base.css">
<style>
  body{padding:20px 26px;background:#fff;display:flex;align-items:center;gap:26px;}
  .mark{display:flex;align-items:center;gap:10px;}
  .mark img{height:45px;width:45px;object-fit:contain;}
  .wm{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--color-ink);}
  .note{font-family:var(--font-body);font-size:11px;color:var(--color-charcoal);line-height:1.5;max-width:300px;}
  .ph{font-family:var(--font-mono);font-size:10px;color:var(--color-mute);}
</style>
</head>
<body>
  <div class="mark">
    <img src="../assets/app-icon-placeholder.svg" alt="app icon">
    <span class="wm">advisories</span>
  </div>
  <div class="note">The app icon is the system's <b>only</b> spot of color and its entire identity. Everything else is ink/white/grey.<br><span class="ph">placeholder — replace per app</span></div>
</body>
</html>

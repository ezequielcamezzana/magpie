<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouped vulnerability cards — advisories</title>
<link rel="icon" href="ui/app-icon.svg">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/base.css">
<link rel="stylesheet" href="vulncard.css">
<style>
  body{ background:var(--color-canvas); }
  .wrap{ max-width:920px; margin:0 auto; padding:40px 24px 64px; }
  .head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:6px; }
  .h{ font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--color-ink); }
  .scan{ font-family:var(--font-mono); font-size:12px; color:var(--color-mute); }
  .sub{ font-family:var(--font-body); font-size:14px; color:var(--color-body); margin-bottom:28px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="grouped-vulns-data.js"></script>
<script type="text/babel" src="GroupedVulnCard.jsx"></script>

<script type="text/babel">
function Demo() {
  return (
    <div className="wrap">
      <div className="head">
        <div className="h">Advisories</div>
        <div className="scan">scan target · axios@1.12.0</div>
      </div>
      <div className="sub">
        {window.VULN_GROUPS.filter(g => g.Affected).length} of {window.VULN_GROUPS.length} canonical
        advisories affect this package. Expand a card to see each contributing source record.
      </div>
      <div className="list">
        {window.VULN_GROUPS.map((g, i) => (
          <GroupedVulnCard key={g.CanonicalID} group={g} defaultOpen={i === 0} />
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>advisories — research tool UI kit</title>
<link rel="icon" href="ui/app-icon.svg">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/base.css">
<link rel="stylesheet" href="ui/ring.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

<script src="ui/ring.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Summary.jsx"></script>
<script type="text/babel" src="AdvisoryList.jsx"></script>
<script type="text/babel" src="AdvisoryDetail.jsx"></script>
<script type="text/babel" src="NewScanModal.jsx"></script>

<script type="text/babel">
function App() {
  const [tab, setTab] = React.useState("Advisories");
  const [selected, setSelected] = React.useState(null);
  const [modal, setModal] = React.useState(false);
  const [signedIn, setSignedIn] = React.useState(false);
  const [advisories, setAdvisories] = React.useState(window.ADVISORIES);

  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const runScan = (target) => {
    setModal(false);
    // fake "scan" — surface the most relevant advisory if the package matches
    const hit = window.ADVISORIES.find(a => target.toLowerCase().includes(a.pkg));
    if (hit) { setSelected(hit); setTab("Advisories"); }
  };

  let body;
  if (selected) {
    body = <AdvisoryDetail adv={selected} onBack={()=>setSelected(null)} />;
  } else if (tab === "Advisories") {
    body = (
      <div className="page">
        <div className="container">
          <div className="app-hero">
            <div className="hero">Know what's vulnerable.</div>
            <div className="hero-sub">Open advisories across your dependencies, scored and sorted.</div>
          </div>
          <Summary advisories={advisories} />
          <AdvisoryList advisories={advisories} onOpen={setSelected} />
        </div>
      </div>
    );
  } else {
    body = (
      <div className="page">
        <div className="container">
          <div className="empty" style={{paddingTop:"96px"}}>
            The <b style={{color:"var(--color-charcoal)"}}>{tab}</b> view is not part of this UI kit.
          </div>
        </div>
      </div>
    );
  }

  return (
    <React.Fragment>
      <Topbar tab={tab} onTab={(t)=>{setTab(t);setSelected(null);}}
              onNewScan={()=>setModal(true)}
              signedIn={signedIn} onSignIn={()=>setSignedIn(true)} />
      {body}
      <Footer />
      {modal && <NewScanModal onClose={()=>setModal(false)} onRun={runScan} />}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vulnerability cards — advisories</title>
<link rel="icon" href="ui/app-icon.svg">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/base.css">
<link rel="stylesheet" href="vulncard.css">
<style>
  body{ background:var(--color-canvas); }
  .wrap{ max-width:720px; margin:0 auto; padding:40px 24px 64px; }
  .h{ font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--color-ink); margin-bottom:6px; }
  .sub{ font-family:var(--font-body); font-size:14px; color:var(--color-body); margin-bottom:28px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail" data-bg-color="#ffffff">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="300" y="250" width="600" height="120" rx="60" fill="none" stroke="#000000" stroke-width="14"/>
    <rect x="330" y="430" width="380" height="120" rx="60" fill="#ffedd5"/>
    <text x="360" y="508" font-family="ui-monospace, monospace" font-size="64" font-weight="700" fill="#9a3412">CVSS</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

<script src="vuln-records-data.js"></script>
<script type="text/babel" src="VulnCard.jsx"></script>

<script type="text/babel">
function Demo() {
  return (
    <div className="wrap">
      <div className="h">Advisories</div>
      <div className="sub">{window.VULN_RECORDS.length} advisories affecting axios@1.12.0.</div>
      <div className="list">
        {window.VULN_RECORDS.map((rec) => <VulnCard key={rec.CanonicalID} rec={rec} />)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Magpie</title>
        <link rel="icon" href="/static/favicon.ico" />
        <link rel="stylesheet" href="/static/ui/tokens.css" />
        <link rel="stylesheet" href="/static/ui/base.css" />
        <link rel="stylesheet" href="/static/app.css" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script>
            // Shared severity bucket (CVSS) — drives every .sev-* / CVSS pill tint.
            function svcBucket(s) {
                if (s >= 9) return "critical";
                if (s >= 7) return "high";
                if (s >= 4) return "medium";
                if (s > 0) return "low";
                return "none";
            }
            // GitHub advisory URL when a GHSA id exists (original/canonical/aliases), else "".
            function githubURL(v) {
                const ids = [
                    v.OriginalID,
                    v.CanonicalID,
                    ...(v.Aliases || []),
                ].filter(Boolean);
                const ghsa = ids.find((i) => i.startsWith("GHSA-"));
                return ghsa ? "https://github.com/advisories/" + ghsa : "";
            }
            // OSV record URL — only shown for OSV-sourced records.
            function osvURL(v) {
                return (
                    "https://osv.dev/vulnerability/" +
                    (v.OriginalID || v.CanonicalID)
                );
            }

            // Grouped advisory card (.vc-card) helpers — Collect view.
            function vcLabel(s) {
                const b = svcBucket(s);
                return b === "none" ? "unknown" : b;
            }
            // Advisory title/summary from the raw payload (ecosyste.ms: title, osv: summary).
            function recTitle(r) {
                const p = r.Payload || {};
                return p.title || p.summary || "";
            }
            // Group freshness tags: NEW if created in the last 24h, UPDATED if updated in
            // the last 24h (and not already NEW, since a fresh vuln is both).
            function within24h(iso) {
                return (
                    !vcEmptyDate(iso) && Date.now() - new Date(iso) <= 86400000
                );
            }
            function isNew(g) {
                return within24h(g.Created);
            }
            function isUpdated(g) {
                return !isNew(g) && within24h(g.Updated);
            }
            // Ecosystem from a spurl: pkg:npm/… → npm.
            function ecoOf(spurl) {
                const m = (spurl || "").match(/^pkg:([^/]+)\//);
                return m ? m[1] : "";
            }
            function vcEmptyDate(iso) {
                return !iso || iso.startsWith("0001");
            } // Go zero time
            function vcFmtDate(iso) {
                if (vcEmptyDate(iso)) return "—";
                const d = new Date(iso),
                    p = (n) => String(n).padStart(2, "0");
                return (
                    p(d.getUTCDate()) +
                    "/" +
                    p(d.getUTCMonth() + 1) +
                    "/" +
                    d.getUTCFullYear()
                );
            }
            function vcRel(iso) {
                if (vcEmptyDate(iso)) return "";
                const days = Math.round(
                    (Date.now() - new Date(iso)) / 86400000,
                );
                if (days <= 0) return "today";
                if (days === 1) return "1 day ago";
                if (days < 30) return days + " days ago";
                const months = Math.round(days / 30);
                if (months < 12)
                    return months === 1
                        ? "1 month ago"
                        : months + " months ago";
                const years = Math.round(days / 365);
                return years === 1 ? "1 year ago" : years + " years ago";
            }

            function router() {
                const fromHash = () => {
                    const h = location.hash.slice(1);
                    if (h.startsWith("vuln/")) return "vuln";
                    if (h.startsWith("component/")) return "component";
                    return ["vulns", "components", "cpes"].includes(h) ? h : "collect";
                };
                return {
                    view: fromHash(),
                    sync() {
                        this.view = fromHash();
                    },
                    go(v) {
                        this.view = v;
                        location.hash = "#" + v;
                    },
                };
            }

            // bundleView(mode) — UNA instancia por página, recreada por el x-for keyed por
            // view (sin estado compartido entre Collect y Component). El filtro/orden/
            // paginación de vulns los hace el BE (vpage/vorder/vfilter).
            function bundleView(mode) {
                return {
                    mode,
                    coord: "",
                    spurl: "",
                    loading: false,
                    result: null,
                    error: null,
                    groupFilter: "affected",
                    expanded: {},
                    vpage: 1,
                    vorder: "severity",
                    vmeta: {
                        Page: 1,
                        Pages: 1,
                        Total: 0,
                        All: 0,
                        Affected: 0,
                        Order: "severity",
                        Filter: "all",
                    },
                    _h: null,
                    init() {
                        if (this.mode === "component") {
                            this.spurl = this.spurlFromHash();
                            this.load();
                            // X→Y dentro de la misma vista component: recargar al cambiar el spurl.
                            this._h = () => {
                                const s = this.spurlFromHash();
                                if (s && s !== this.spurl) {
                                    this.spurl = s;
                                    this.vpage = 1;
                                    this.expanded = {};
                                    this.load();
                                }
                            };
                            window.addEventListener("hashchange", this._h);
                        }
                    },
                    destroy() {
                        if (this._h)
                            window.removeEventListener("hashchange", this._h);
                    },
                    spurlFromHash() {
                        const m = location.hash.match(/^#component\/(.+)$/);
                        return m ? decodeURIComponent(m[1]) : "";
                    },
                    // Prepend "pkg:" so the user never has to type it (idempotent if pasted).
                    normalizedCoord() {
                        const c = (this.coord || "").trim();
                        if (!c) return "";
                        return c.startsWith("pkg:") ? c : "pkg:" + c;
                    },
                    run() {
                        if (!this.normalizedCoord()) return;
                        this.vpage = 1;
                        this.expanded = {};
                        this.load();
                    },
                    setFilter(f) {
                        if (this.groupFilter === f) return;
                        this.groupFilter = f;
                        this.vpage = 1;
                        this.load();
                    },
                    onOrder() {
                        this.vpage = 1;
                        this.load();
                    },
                    prevV() {
                        if (this.vpage > 1) {
                            this.vpage--;
                            this.load();
                        }
                    },
                    nextV() {
                        if (this.vpage < this.vmeta.Pages) {
                            this.vpage++;
                            this.load();
                        }
                    },
                    async load() {
                        let url;
                        if (this.mode === "component") {
                            if (!this.spurl) return;
                            url =
                                "/component?" +
                                new URLSearchParams({
                                    spurl: this.spurl,
                                    vpage: this.vpage,
                                    vorder: this.vorder,
                                });
                        } else {
                            const coord = this.normalizedCoord();
                            if (!coord) return;
                            url =
                                "/collect?" +
                                new URLSearchParams({
                                    purl: coord,
                                    vpage: this.vpage,
                                    vorder: this.vorder,
                                    vfilter: this.groupFilter,
                                });
                        }
                        this.loading = true;
                        this.error = null;
                        try {
                            const r = await fetch(url);
                            if (!r.ok) {
                                const e = await r.json().catch(() => ({}));
                                this.error = e.error || "HTTP " + r.status;
                                this.result = null;
                                return;
                            }
                            this.result = await r.json();
                            this.vmeta = this.result.Vuln || this.vmeta;
                        } catch (e) {
                            this.error = String(e);
                            this.result = null;
                        } finally {
                            this.loading = false;
                        }
                    },
                    get groups() {
                        return (this.result && this.result.Groups) || [];
                    },
                    toggle(id) {
                        this.expanded[id] = !this.expanded[id];
                    },
                    queriedVersion() {
                        const c = (this.result && this.result.Coord) || "";
                        const at = c.lastIndexOf("@");
                        return at >= 0 ? c.slice(at + 1) : "no version";
                    },
                    // "name@version" for the match strip (e.g. axios@1.12.0).
                    scannedTarget() {
                        const v = this.queriedVersion();
                        if (v === "no version") return "no version";
                        const name =
                            (this.result &&
                                this.result.Component &&
                                this.result.Component.Name) ||
                            "";
                        return name ? name + "@" + v : v;
                    },
                    compName() {
                        return (
                            (this.result &&
                                this.result.Component &&
                                this.result.Component.Name) ||
                            this.spurl
                        );
                    },
                    // Versión a mostrar: la consultada (collect) o la latest (component).
                    cardVersion() {
                        const v = this.queriedVersion();
                        if (v !== "no version") return v;
                        return (
                            (this.result &&
                                this.result.Component &&
                                this.result.Component.LatestVersion) ||
                            "—"
                        );
                    },
                    // Ecosystem isn't stored yet — derive it from the purl (pkg:npm/… → npm).
                    ecosystem() {
                        const s =
                            (this.result &&
                                this.result.Component &&
                                this.result.Component.SPURL) ||
                            "";
                        const m = s.match(/^pkg:([^/]+)\//);
                        return m ? m[1] : "";
                    },
                };
            }

            function components() {
                return {
                    name: "",
                    ecosystem: "",
                    page: 1,
                    limit: 25,
                    records: [],
                    total: 0,
                    loading: false,
                    error: null,
                    _t: null,
                    ecosystems: [
                        "npm",
                        "pypi",
                        "golang",
                        "cargo",
                        "gem",
                        "maven",
                        "nuget",
                        "composer",
                    ],
                    init() {
                        this.load();
                    },
                    get pages() {
                        return Math.max(1, Math.ceil(this.total / this.limit));
                    },
                    onInput() {
                        clearTimeout(this._t);
                        this._t = setTimeout(() => {
                            this.page = 1;
                            this.load();
                        }, 300);
                    },
                    onEco() {
                        this.page = 1;
                        this.load();
                    },
                    prev() {
                        if (this.page > 1) {
                            this.page--;
                            this.load();
                        }
                    },
                    next() {
                        if (this.page < this.pages) {
                            this.page++;
                            this.load();
                        }
                    },
                    async load() {
                        this.loading = true;
                        this.error = null;
                        try {
                            const r = await fetch(
                                "/components?" +
                                    new URLSearchParams({
                                        name: this.name,
                                        ecosystem: this.ecosystem,
                                        page: this.page,
                                        limit: this.limit,
                                    }),
                            );
                            if (!r.ok) {
                                const e = await r.json().catch(() => ({}));
                                this.error = e.error || "HTTP " + r.status;
                                return;
                            }
                            const d = await r.json();
                            this.records = d.components || [];
                            this.total = d.total || 0;
                        } catch (e) {
                            this.error = String(e);
                        } finally {
                            this.loading = false;
                        }
                    },
                };
            }

            function vulnDetail() {
                return {
                    id: "",
                    cards: [],
                    loading: false,
                    error: null,
                    init() {
                        this.sync();
                        window.addEventListener("hashchange", () =>
                            this.sync(),
                        );
                    },
                    sync() {
                        const m = location.hash.match(/^#vuln\/(.+)$/);
                        if (!m) return;
                        const id = decodeURIComponent(m[1]);
                        if (id !== this.id) {
                            this.id = id;
                            this.load();
                        }
                    },
                    async load() {
                        this.loading = true;
                        this.error = null;
                        this.cards = [];
                        try {
                            const r = await fetch(
                                "/vulnerability?" +
                                    new URLSearchParams({ id: this.id }),
                            );
                            if (!r.ok) {
                                const e = await r.json().catch(() => ({}));
                                this.error = e.error || "HTTP " + r.status;
                                return;
                            }
                            const d = await r.json();
                            this.cards = this.groupCards(d.records || []);
                        } catch (e) {
                            this.error = String(e);
                        } finally {
                            this.loading = false;
                        }
                    },
                    // Un card por advisory (source + originalID); cada record aporta un paquete afectado.
                    groupCards(records) {
                        const map = {},
                            order = [];
                        for (const r of records) {
                            const key = r.Source + "|" + r.OriginalID;
                            let c = map[key];
                            if (!c) {
                                c = {
                                    source: r.Source,
                                    originalID: r.OriginalID,
                                    canonicalID: r.CanonicalID,
                                    score: r.Score,
                                    ecosystem: ecoOf(r.AffectedPackage),
                                    title: recTitle(r),
                                    published: r.Published,
                                    updated: r.Modified,
                                    record: r,
                                    packages: [],
                                };
                                map[key] = c;
                                order.push(c);
                            }
                            c.packages.push({
                                purl: r.AffectedPackage || "",
                                open: c.packages.length === 0,
                                showAll: false,
                                affected: r.AffectedVersions || [],
                                ranges: r.AffectedRanges || [],
                                unaffected: r.UnaffectedVersions || [],
                                fixed: r.FixedVersions || [],
                            });
                        }
                        return order;
                    },
                };
            }

            function vulns() {
                return {
                    id: "",
                    page: 1,
                    limit: 24,
                    records: [],
                    total: 0,
                    loading: false,
                    error: null,
                    _t: null,
                    init() {
                        this.load();
                    },
                    get pages() {
                        return Math.max(1, Math.ceil(this.total / this.limit));
                    },
                    onInput() {
                        clearTimeout(this._t);
                        this._t = setTimeout(() => {
                            this.page = 1;
                            this.load();
                        }, 300);
                    },
                    prev() {
                        if (this.page > 1) {
                            this.page--;
                            this.load();
                        }
                    },
                    next() {
                        if (this.page < this.pages) {
                            this.page++;
                            this.load();
                        }
                    },
                    async load() {
                        this.loading = true;
                        this.error = null;
                        try {
                            const r = await fetch(
                                "/vulnerabilities?" +
                                    new URLSearchParams({
                                        id: this.id,
                                        page: this.page,
                                        limit: this.limit,
                                    }),
                            );
                            if (!r.ok) {
                                const e = await r.json().catch(() => ({}));
                                this.error = e.error || "HTTP " + r.status;
                                return;
                            }
                            const d = await r.json();
                            this.records = d.records || [];
                            this.total = d.total || 0;
                        } catch (e) {
                            this.error = String(e);
                        } finally {
                            this.loading = false;
                        }
                    },
                };
            }

            // cpes() — índice global de CPEs resueltos (espejo de vulns()).
            function cpes() {
                return {
                    search: "",
                    page: 1,
                    limit: 24,
                    records: [],
                    total: 0,
                    loading: false,
                    error: null,
                    _t: null,
                    init() {
                        this.load();
                    },
                    // "cpe:2.3:a:axios:axios" → prefix mute + vendor:product en ink.
                    parts(c) {
                        const segs = (c.CPE || "").split(":");
                        return {
                            prefix: segs.slice(0, 3).join(":"),
                            vendor: segs[3] || "",
                            product: segs[4] || "",
                        };
                    },
                    matched(c, dim) {
                        return (c.MatchedBy || []).includes(dim);
                    },
                    nMatched(c) {
                        return (c.MatchedBy || []).length;
                    },
                    get pages() {
                        return Math.max(1, Math.ceil(this.total / this.limit));
                    },
                    onInput() {
                        clearTimeout(this._t);
                        this._t = setTimeout(() => {
                            this.page = 1;
                            this.load();
                        }, 300);
                    },
                    prev() {
                        if (this.page > 1) {
                            this.page--;
                            this.load();
                        }
                    },
                    next() {
                        if (this.page < this.pages) {
                            this.page++;
                            this.load();
                        }
                    },
                    async load() {
                        this.loading = true;
                        this.error = null;
                        try {
                            const r = await fetch(
                                "/cpes?" +
                                    new URLSearchParams({
                                        search: this.search,
                                        page: this.page,
                                        limit: this.limit,
                                    }),
                            );
                            if (!r.ok) {
                                const e = await r.json().catch(() => ({}));
                                this.error = e.error || "HTTP " + r.status;
                                return;
                            }
                            const d = await r.json();
                            this.records = d.cpes || [];
                            this.total = d.total || 0;
                        } catch (e) {
                            this.error = String(e);
                        } finally {
                            this.loading = false;
                        }
                    },
                };
            }
        </script>
    </head>
    <body x-data="router()" @hashchange.window="sync()">
        <nav class="nav">
            <div class="nav-left">
                <span class="nav-brand">
                    <img
                        class="nav-logo"
                        src="/static/icon-512.png"
                        alt=""
                    />magpie
                </span>
                <div class="nav-links">
                    <a
                        class="nav-link"
                        :class="{active: view==='collect'}"
                        href="#collect"
                        @click.prevent="go('collect')"
                        >Collect</a
                    >
                    <a
                        class="nav-link"
                        :class="{active: view==='components'}"
                        href="#components"
                        @click.prevent="go('components')"
                        >Components</a
                    >
                    <a
                        class="nav-link"
                        :class="{active: view==='vulns'}"
                        href="#vulns"
                        @click.prevent="go('vulns')"
                        >Vulnerabilities</a
                    >
                    <a
                        class="nav-link"
                        :class="{active: view==='cpes'}"
                        href="#cpes"
                        @click.prevent="go('cpes')"
                        >CPEs</a
                    >
                </div>
            </div>
        </nav>

        <!-- x-for keyed por view: recrea el componente al cambiar collect↔component
       (lifecycle fresco, sin estado compartido). -->
        <template
            x-for="bv in ((view==='collect' || view==='component') ? [view] : [])"
            :key="bv"
        >
            <main class="container bundle-main" x-data="bundleView(bv)">
                <template x-if="mode==='collect'">
                    <section class="section">
                        <h1 class="hero">Magpie — SCA scavenger</h1>
                        <p class="hero-sub">
                            Paste a purl or spurl to scavenge metadata, repo,
                            and vulnerabilities.
                        </p>

                        <div class="form form-hero">
                            <div class="coord-field">
                                <span class="coord-prefix">pkg:</span>
                                <input
                                    class="coord-input"
                                    x-model="coord"
                                    placeholder="npm/chalk@5.0.0"
                                    @keydown.enter="run()"
                                />
                            </div>
                            <button
                                class="btn-primary"
                                @click="run()"
                                :disabled="loading"
                                x-text="loading ? 'Collecting…' : 'Collect'"
                            ></button>
                        </div>
                    </section>
                </template>

                <template x-if="mode==='component'">
                    <section class="section">
                        <div class="crumb">
                            component / <b x-text="compName()"></b>
                        </div>
                        <div class="ph">
                            <div>
                                <div class="ph-title" x-text="compName()"></div>
                                <div class="ph-target" x-text="spurl"></div>
                            </div>
                            <a
                                class="nav-link"
                                href="#components"
                                @click.prevent="go('components')"
                                >‹ back</a
                            >
                        </div>
                    </section>
                </template>

                <template x-if="error">
                    <section class="section card card-strong">
                        <div class="errors-title">Couldn't load</div>
                        <div class="error-item" x-text="error"></div>
                    </section>
                </template>

                <template x-if="result">
                    <section class="section stack">
                        <template x-if="result.Component">
                            <div class="pkg">
                                <div class="pkg-head">
                                    <span class="pkg-icon">
                                        <img
                                            x-show="result.Component.Icon"
                                            :src="result.Component.Icon"
                                            alt=""
                                        />
                                        <svg
                                            x-show="!result.Component.Icon"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            aria-hidden="true"
                                        >
                                            <path d="m7.5 4.27 9 5.15" />
                                            <path
                                                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
                                            />
                                            <path d="m3.3 7 8.7 5 8.7-5" />
                                            <path d="M12 22V12" />
                                        </svg>
                                    </span>
                                    <div class="pkg-id">
                                        <div
                                            class="pkg-name"
                                            x-text="result.Component.Name"
                                        ></div>
                                        <div
                                            class="pkg-coord"
                                            x-text="result.Coord || result.Component.SPURL"
                                        ></div>
                                    </div>
                                    <a
                                        class="pkg-repo-link"
                                        x-show="result.Component.RepoURL"
                                        :href="result.Component.RepoURL"
                                        target="_blank"
                                        rel="noopener"
                                    >
                                        <svg
                                            viewBox="0 0 24 24"
                                            fill="currentColor"
                                            aria-hidden="true"
                                        >
                                            <path
                                                d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.8 1.6 2.6 1.4.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.6 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1.9-.2 1.8-.4 2.7-.4.9 0 1.8.1 2.7.4 2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.3-5.1 5.6.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"
                                            />
                                        </svg>
                                        Repository
                                    </a>
                                </div>

                                <div class="pkg-meta">
                                    <div class="pkg-field">
                                        <div
                                            class="pkg-flabel"
                                            x-text="mode==='component' ? 'Latest version' : 'Latest version'"
                                        ></div>
                                        <div
                                            class="pkg-fval mono"
                                            x-text="cardVersion()"
                                        ></div>
                                    </div>
                                    <div class="pkg-field">
                                        <div class="pkg-flabel">Ecosystem</div>
                                        <div class="pkg-fval">
                                            <span
                                                class="pkg-eco"
                                                x-show="ecosystem()"
                                                x-text="ecosystem()"
                                            ></span>
                                            <span
                                                class="pkg-muted"
                                                x-show="!ecosystem()"
                                                >—</span
                                            >
                                        </div>
                                    </div>
                                    <div class="pkg-field">
                                        <div class="pkg-flabel">License</div>
                                        <div
                                            class="pkg-fval"
                                            x-text="(result.Component.Licenses && result.Component.Licenses.length) ? result.Component.Licenses.join(', ') : '—'"
                                        ></div>
                                    </div>
                                    <div class="pkg-field">

                                            <path d="M7 17 17 7" />

                                                        :class="'sev-' + svcBucket(m.Record.Score)"

                                                            class="svc-score-type"
                                                            >CVSS</span
                                                        >
                                                        <span
                                                            class="svc-score-sep"
                                                            >·</span
                                                        >
                                                        <span
                                                            class="svc-score-val"
                                                            x-text="Number(m.Record.Score).toFixed(1)"
                                                        ></span>
                                                        <span
                                                            class="svc-score-sep"
                                                            >·</span
                                                        >
                                                        <span
                                                            class="svc-score-bucket"
                                                            x-text="vcLabel(m.Record.Score)"
                                                        ></span>
                                                    </span>
                                                </div>

                                                <div
                                                    class="vc-desc"
                                                    x-show="recTitle(m.Record)"
                                                    x-text="recTitle(m.Record)"
                                                ></div>

                                                <div
                                                    class="vc-match"
                                                    x-show="mode==='collect'"
                                                    :class="m.Verdict.Matched ? 'is-match' : 'no-match'"

                                                        <span class="vc-dlabel"
                                                            >Updated</span
                                                        >
                                                        <span
                                                            x-text="vcFmtDate(m.Record.Modified)"

                                                            viewBox="0 0 24 24"

                                                                d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.8 1.6 2.6 1.4.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.6 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1.9-.2 1.8-.4 2.7-.4.9 0 1.8.1 2.7.4 2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.3-5.1 5.6.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"
                                                            />

                                                        GitHub advisory

                                                        <svg

                                                            <path

                                                            />
                                                        </svg>
                                                        OSV
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </section>
                </template>

        <main

                                            >
                                            <span class="svc-score-sep">·</span>

                                            />
